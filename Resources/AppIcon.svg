<?xml version="1.0" encoding="UTF-8"?>
<!--
  Codex Usage — app icon master (1024×1024, transparent margin).
  Squircle: 824 wide with a 185 corner radius on a 1024 canvas.
  Glyph: dashed quota ring + refresh arrow + the three quota tiers from the app.
  Regenerate the .icns with tools/build-icon.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Codex Usage">
  <defs>
    <path id="tile" d="M285 100 H739 A185 185 0 0 1 924 285 V739 A185 185 0 0 1 739 924 H285 A185 185 0 0 1 100 739 V285 A185 185 0 0 1 285 100 Z"/>
    <clipPath id="tileClip"><use href="#tile" xlink:href="#tile"/></clipPath>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0" stop-color="#0C1B36"/>
      <stop offset="0.55" stop-color="#071024"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.44" r="0.68">
      <stop offset="0" stop-color="#1D74E8" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#123262" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#04070E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.64" y1="0.1" x2="0.26" y2="0.94">
      <stop offset="0" stop-color="#D6FFFF"/>
      <stop offset="0.18" stop-color="#7BEEFF"/>
      <stop offset="0.5" stop-color="#2FD0FF"/>
      <stop offset="0.76" stop-color="#1E7CFF"/>
      <stop offset="1" stop-color="#1230D8"/>
    </linearGradient>
    <linearGradient id="bargreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BF2A2"/>
      <stop offset="0.52" stop-color="#2AD77F"/>
      <stop offset="1" stop-color="#0F9A54"/>
    </linearGradient>
    <linearGradient id="barblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43C2FF"/>
      <stop offset="0.52" stop-color="#2198EE"/>
      <stop offset="1" stop-color="#0A58CE"/>
    </linearGradient>
    <linearGradient id="barred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6F5F"/>
      <stop offset="0.52" stop-color="#EA463C"/>
      <stop offset="1" stop-color="#C42726"/>
    </linearGradient>
    <linearGradient id="barGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="ringGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tileFill)"/>
    <rect width="1024" height="1024" fill="url(#tileGlow)"/>

    <!-- quota ring: soft bloom, empty track, live arc -->
    <path d="M552.50 223.83 A291 291 0 1 0 758.78 666.21" fill="none" stroke="#2FD0FF" stroke-width="84"
          stroke-linecap="round" opacity="0.14" filter="url(#ringGlow)"/>
    <g fill="none" stroke="#233654" stroke-width="28" stroke-linecap="round">
      <path d="M803.00 513.34 A291 291 0 0 0 799.68 468.16"/>
      <path d="M796.50 450.82 A291 291 0 0 0 783.56 407.41"/>
      <path d="M776.72 391.16 A291 291 0 0 0 754.76 351.54"/>
      <path d="M744.60 337.13 A291 291 0 0 0 714.64 303.15"/>
      <path d="M701.62 291.26 A291 291 0 0 0 665.07 264.51"/>
    </g>
    <path d="M552.50 223.83 A291 291 0 1 0 758.78 666.21" fill="none" stroke="url(#ring)" stroke-width="62" stroke-linecap="round"/>

    <!-- refresh arrow, pointing along the arc -->
    <path d="M798.43,693.34 L785.28,623.80 L717.02,642.47 Z" fill="url(#ring)" stroke="url(#ring)" stroke-width="20" stroke-linejoin="round"/>

    <!-- the three quota tiers -->
    <g>
      <rect x="386" y="401" width="252" height="58" rx="29" fill="url(#bargreen)"/>
      <rect x="386" y="401" width="252" height="58" rx="29" fill="url(#barGloss)"/>
    </g>
    <g>
      <rect x="386" y="485" width="252" height="58" rx="29" fill="url(#barblue)"/>
      <rect x="386" y="485" width="252" height="58" rx="29" fill="url(#barGloss)"/>
    </g>
    <g>
      <rect x="386" y="569" width="252" height="58" rx="29" fill="url(#barred)"/>
      <rect x="386" y="569" width="252" height="58" rx="29" fill="url(#barGloss)"/>
    </g>
  </g>

  <use href="#tile" xlink:href="#tile" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
