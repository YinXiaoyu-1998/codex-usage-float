<?xml version="1.0" encoding="UTF-8"?>
<!--
  Codex Usage — 16/32 px variant: no dashes, no glow, thicker strokes and bigger bars.
  Only used for the smallest slots of the .icns.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Codex Usage">
  <defs>
    <path id="tile" d="M285 100 H739 A185 185 0 0 1 924 285 V739 A185 185 0 0 1 739 924 H285 A185 185 0 0 1 100 739 V285 A185 185 0 0 1 285 100 Z"/>
    <clipPath id="tileClip"><use href="#tile" xlink:href="#tile"/></clipPath>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0C1B36"/>
      <stop offset="0.55" stop-color="#071024"/>
      <stop offset="1" stop-color="#04070E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.64" y1="0.1" x2="0.26" y2="0.94">
      <stop offset="0" stop-color="#B9FAFF"/>
      <stop offset="0.22" stop-color="#6BEAFF"/>
      <stop offset="0.55" stop-color="#27CBFF"/>
      <stop offset="0.8" stop-color="#1B78FF"/>
      <stop offset="1" stop-color="#1533E8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FF6A5"/><stop offset="1" stop-color="#12A45C"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FCBFF"/><stop offset="1" stop-color="#0A5AD6"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7868"/><stop offset="1" stop-color="#C92524"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tileFill)"/>
    <path d="M551.80 228.78 A286 286 0 1 0 754.54 663.56" fill="none" stroke="url(#ring)" stroke-width="82" stroke-linecap="round"/>
    <path d="M791.43,691.33 L783.16,617.76 L713.41,642.57 Z" fill="url(#ring)" stroke="url(#ring)" stroke-width="24" stroke-linejoin="round"/>
    <rect x="382" y="396" width="260" height="64" rx="32" fill="url(#barGreen)"/>
    <rect x="382" y="486" width="260" height="64" rx="32" fill="url(#barBlue)"/>
    <rect x="382" y="576" width="260" height="64" rx="32" fill="url(#barRed)"/>
  </g>
  <use href="#tile" xlink:href="#tile" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
