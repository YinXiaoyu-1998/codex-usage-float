<svg xmlns="http://www.w3.org/2000/svg" width="412" height="26" viewBox="0 0 412 26" role="img" aria-labelledby="title desc">
  <title id="title">Ember Pulse — 28% remaining</title>
  <desc id="desc">10–39% · 暖光呼吸 2.4s · 洗光浮动 4.6s</desc>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1628"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.34" stop-color="#f7b32b"/>
      <stop offset="0.72" stop-color="#d97706"/>
      <stop offset="1" stop-color="#8f3d05"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fillClip"><rect width="115.36" height="26" rx="13"/></clipPath>
    <clipPath id="trackClip"><rect x="1" y="1" width="410" height="24" rx="12"/></clipPath>
    <radialGradient id="bloomA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0" stop-opacity="0.80"/>
      <stop offset="0.38" stop-color="#ffb347" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cd" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffe6ad" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .bloom  { animation: breathe 2.4s ease-in-out infinite alternate; }
    .warm   { animation: warmShift 4.6s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity: 0.4; transform: scale(0.8); } to { opacity: 1; transform: scale(1.18); } }
    @keyframes warmShift { from { transform: translateY(-3px); opacity: 0.55; } to { transform: translateY(4px); opacity: 1; } }
    </style>
  </defs>

  <!-- track -->
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="url(#track)"/>
  <path d="M3.5 2.2 H408.5" stroke="#000000" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M4 24.3 H408" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="none" stroke="#b9c8ff" stroke-opacity="0.13"/>
  

  <!-- fill -->
  <g clip-path="url(#fillClip)">
    <rect width="115.36" height="26" fill="url(#fill)"/>
    <g class="warm" opacity="0.6">
      <rect x="0" y="-4" width="115.36" height="34" fill="url(#warmWash)"/>
    </g>
    <g class="bloom">
      <circle cx="101.36" cy="13" r="26" fill="url(#bloomA)"/>
    </g>
    <rect width="115.36" height="26" fill="url(#gloss)"/>
    <rect width="14" height="26" fill="url(#leftShade)"/>
    <rect x="0.5" y="0.5" width="114.36" height="25" rx="12.5" fill="none" stroke="#ffd9a0" stroke-opacity="0.3"/>
  </g>

  <!-- glass edge -->
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
