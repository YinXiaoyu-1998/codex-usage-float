<svg xmlns="http://www.w3.org/2000/svg" width="412" height="26" viewBox="0 0 412 26" role="img" aria-labelledby="title desc">
  <title id="title">Ribbon Flow — 56% remaining</title>
  <desc id="desc">40–69% · 光带 1.7s/周期 · 高光 3.4s</desc>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1628"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#9af2ff"/>
      <stop offset="0.34" stop-color="#2fb4f5"/>
      <stop offset="0.72" stop-color="#1479d6"/>
      <stop offset="1" stop-color="#0a4f9e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.24" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fillClip"><rect width="230.72" height="26" rx="13"/></clipPath>
    <clipPath id="trackClip"><rect x="1" y="1" width="410" height="24" rx="12"/></clipPath>
    <linearGradient id="bandFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .bands { animation: flow 1.7s linear infinite; }
    .sheen { animation: sheen 3.4s linear infinite; }
    @keyframes flow  { from { transform: translateX(0); } to { transform: translateX(66px); } }
    @keyframes sheen { from { transform: translateX(-160px); } to { transform: translateX(380.72px); } }
    </style>
  </defs>

  <!-- track -->
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="url(#track)"/>
  <path d="M3.5 2.2 H408.5" stroke="#000000" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M4 24.3 H408" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="none" stroke="#b9c8ff" stroke-opacity="0.13"/>
  

  <!-- fill -->
  <g clip-path="url(#fillClip)">
    <rect width="230.72" height="26" fill="url(#fill)"/>
    <g class="bands" opacity="0.95">
      <path d="M-198 26 L-190 26 L-178 0 L-186 0 Z" fill="url(#bandFill)"/>
      <path d="M-132 26 L-124 26 L-112 0 L-120 0 Z" fill="url(#bandFill)"/>
      <path d="M-66 26 L-58 26 L-46 0 L-54 0 Z" fill="url(#bandFill)"/>
      <path d="M0 26 L8 26 L20 0 L12 0 Z" fill="url(#bandFill)"/>
      <path d="M66 26 L74 26 L86 0 L78 0 Z" fill="url(#bandFill)"/>
      <path d="M132 26 L140 26 L152 0 L144 0 Z" fill="url(#bandFill)"/>
      <path d="M198 26 L206 26 L218 0 L210 0 Z" fill="url(#bandFill)"/>
      <path d="M264 26 L272 26 L284 0 L276 0 Z" fill="url(#bandFill)"/>
    </g>
    <g class="sheen" opacity="0.75">
      <rect x="-16" y="-8" width="16" height="42" fill="url(#sheenGrad)" transform="rotate(-15 0 13)"/>
    </g>
    <rect width="230.72" height="26" fill="url(#gloss)"/>
    <rect width="14" height="26" fill="url(#leftShade)"/>
    <rect x="0.5" y="0.5" width="229.72" height="25" rx="12.5" fill="none" stroke="#b7ecff" stroke-opacity="0.26"/>
  </g>

  <!-- glass edge -->
  <rect x="0.5" y="0.5" width="411" height="25" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
